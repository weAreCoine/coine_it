# =====================================================================
# Health Check Quiz — Configurazione contenuti
# ---------------------------------------------------------------------
# Questo file contiene domande, opzioni, punteggi e testi di valutazione
# del quiz "Health Check" che genera il report per i lead.
#
# REGOLE STRUTTURALI:
#   - La somma dei `weight` delle domande con `scored: true` deve = 100.
#   - Per ogni domanda scored, il `points` massimo tra le opzioni deve
#     essere uguale al `weight` della domanda.
#   - `key` deve essere univoco e in snake_case (è anche la chiave salvata
#     in DB nel campo `quiz_answers` dei lead, e usata in `area_labels`).
#   - `threshold_max`: punti <= questo valore -> finding "negativo".
#   - `threshold_min`: punti >= questo valore -> finding "positivo".
#   - `result_ranges` deve coprire 0-100 senza buchi e senza sovrapposizioni.
#   - Per ogni domanda scored, deve esistere una entry in `area_labels`
#     con la stessa `key` (usata per i fallback findings).
# =====================================================================

questions:
  # -------------------------------------------------------------------
  # Domanda 1 — profilazione (non assegna punteggio)
  # -------------------------------------------------------------------
  - id: 1
    order: 1
    key: platform
    text: "Qual è la tua piattaforma e-commerce?"
    hint: "La piattaforma determina le possibilità di integrazione e le opzioni di ottimizzazione tecnica."
    scored: false
    weight: 0
    finding: null
    options:
      - { label: "WooCommerce",                       value: "woocommerce",        points: 0 }
      - { label: "Shopify",                           value: "shopify",            points: 0 }
      - { label: "PrestaShop / Magento",              value: "prestashop_magento", points: 0 }
      - { label: "Sviluppo custom o altra piattaforma", value: "custom",           points: 0 }

  # -------------------------------------------------------------------
  # Domanda 2 — Advertising (peso 12)
  # -------------------------------------------------------------------
  - id: 2
    order: 2
    key: advertising
    text: "Come gestisci l'advertising in questo momento?"
    hint: "La gestione delle campagne è spesso il primo punto dove si perde efficienza."
    scored: true
    weight: 12
    finding:
      negative_title: "Advertising non ancora attivo"
      negative_text: "Non stai ancora investendo in advertising. Non è un problema di per sé, ma significa che la crescita dipende interamente da canali che non controlli."
      positive_title: "Gestione advertising attiva"
      positive_text: "Hai una gestione advertising attiva. Il passo successivo è assicurarti che ogni euro speso lavori in sinergia con quello che succede sul sito."
      threshold_max: 3
      threshold_min: 9
    options:
      - { label: "Non faccio ancora advertising",          value: "none",      points: 3 }
      - { label: "Gestisco le campagne internamente",      value: "internal",  points: 6 }
      - { label: "Ho un freelance o una piccola agenzia",  value: "freelance", points: 9 }
      - { label: "Lavoro con un'agenzia strutturata",      value: "agency",    points: 12 }

  # -------------------------------------------------------------------
  # Domanda 3 — Coordinamento marketing/sviluppo (peso 25)
  # -------------------------------------------------------------------
  - id: 3
    order: 3
    key: coordination
    text: "Stai per lanciare una nuova campagna e hai bisogno di una modifica al sito. Come gestisci la situazione?"
    hint: "La velocità di intervento sul sito è uno dei fattori più sottovalutati nella performance delle campagne."
    scored: true
    weight: 25
    finding:
      negative_title: "Marketing e sviluppo disconnessi"
      negative_text: "Campagne e sito vivono in due mondi separati. Ogni volta che una modifica al sito aspetta lo sviluppatore, le tue campagne girano su una pagina che non è ottimizzata e il budget paga il costo di quell'attesa."
      positive_title: "Controllo sulla catena campagna→sito"
      positive_text: "Hai il controllo sulla catena campagna→sito. Questa velocità di esecuzione è un vantaggio competitivo che la maggior parte degli e-commerce della tua dimensione non ha."
      threshold_max: 7
      threshold_min: 17
    options:
      - { label: "Marketing e sviluppo sono gestiti da fornitori diversi che si coordinano poco", value: "separate", points: 0 }
      - { label: "Contatto uno sviluppatore esterno e mi adatto ai suoi tempi",                   value: "external", points: 7 }
      - { label: "Lo gestisco io, intervengo direttamente sul sito",                              value: "self",     points: 15 }
      - { label: "Ho un team/persona interna che interviene in tempi rapidi",                     value: "internal", points: 25 }

  # -------------------------------------------------------------------
  # Domanda 4 — Tracciamento dati (peso 25)
  # -------------------------------------------------------------------
  - id: 4
    order: 4
    key: tracking
    text: "Quanto ti fidi dei dati su cui basi le decisioni per il tuo e-commerce?"
    hint: "Il 53% degli e-commerce ottimizza le campagne su dati incompleti o errati."
    scored: true
    weight: 25
    finding:
      negative_title: "Dati non affidabili"
      negative_text: "Stai prendendo decisioni senza una base dati affidabile. Ottimizzare le campagne con dati incompleti è come guidare di notte a fari spenti: puoi andare avanti, ma non sai cosa stai evitando o dove stai andando."
      positive_title: "Setup tracciamento sopra la media"
      positive_text: "Il tuo setup di tracciamento è sopra la media. Questo ti dà un vantaggio reale: ogni decisione può partire dai numeri, non dalle sensazioni."
      threshold_max: 8
      threshold_min: 17
    options:
      - { label: "Non ho un setup strutturato, vado spesso a intuito",                       value: "none",     points: 0 }
      - { label: "Ho GA4 configurato, ma non mi fido completamente dei numeri",              value: "basic",    points: 8 }
      - { label: "Ho un setup discreto, anche se so che ci sono lacune",                     value: "decent",   points: 17 }
      - { label: "Setup completo: GA4, GTM, eventi e-commerce, pixel (e li uso davvero)",    value: "complete", points: 25 }

  # -------------------------------------------------------------------
  # Domanda 5 — Esperienza mobile (peso 20)
  # -------------------------------------------------------------------
  - id: 5
    order: 5
    key: mobile
    text: "Se un cliente apre il tuo sito dallo smartphone e prova a comprare, come va?"
    hint: "Oltre il 60% degli acquisti online avviene da smartphone. Il checkout mobile è spesso il punto di frizione più sottovalutato."
    scored: true
    weight: 20
    finding:
      negative_title: "Esperienza mobile non ottimizzata"
      negative_text: "Il 60% dei tuoi potenziali clienti compra da smartphone. Se il checkout mobile non è stato testato e ottimizzato, stai perdendo vendite ogni giorno e probabilmente non sai quante."
      positive_title: "Checkout mobile ottimizzato"
      positive_text: "Un checkout mobile ottimizzato ti mette avanti rispetto alla maggior parte dei competitor. È un vantaggio diretto sul tasso di conversione."
      threshold_max: 5
      threshold_min: 13
    options:
      - { label: "Non l'ho mai testato seriamente, non saprei dire",        value: "unknown",   points: 0 }
      - { label: "Lento o poco ottimizzato (lo so, è un problema)",         value: "slow",      points: 5 }
      - { label: "Funziona, ma non l'abbiamo ottimizzato in modo specifico", value: "ok",       points: 13 }
      - { label: "Ottimizzato: pochi step, veloce, pensato per il mobile",  value: "optimized", points: 20 }

  # -------------------------------------------------------------------
  # Domanda 6 — Retention/fidelizzazione (peso 18)
  # -------------------------------------------------------------------
  - id: 6
    order: 6
    key: retention
    text: "Dopo il primo acquisto, cosa succede al tuo cliente?"
    hint: "Acquisire un nuovo cliente costa 5-7 volte di più che fidelizzarne uno esistente. Eppure è l'area più trascurata negli e-commerce sotto €1M."
    scored: true
    weight: 18
    finding:
      negative_title: "Nessuna retention automatizzata"
      negative_text: "Dopo il primo acquisto, i tuoi clienti non ricevono nulla di automatizzato. Stai pagando per acquisirli e poi li lasci andare! Acquisire un nuovo cliente costa 5-7 volte di più che far tornare uno esistente."
      positive_title: "Flussi di retention attivi"
      positive_text: "Hai flussi di retention attivi. Questo significa che non stai solo comprando traffico, stai costruendo un asset di clienti che tornano."
      threshold_max: 6
      threshold_min: 14
    options:
      - { label: "Niente di automatizzato, ci penso manualmente quando posso",                       value: "none",     points: 0 }
      - { label: "Ho qualche email automatica ma non so quanto funzioni",                            value: "basic",    points: 6 }
      - { label: "Ho flussi attivi (benvenuto, carrello abbandonato, post-acquisto) e li monitoro",  value: "active",   points: 14 }
      - { label: "Ho un sistema di retention strutturato con segmentazione e flussi multipli",       value: "advanced", points: 18 }

# =====================================================================
# CONFIGURAZIONE RISULTATO
# =====================================================================
quiz_config:

  # Fasce di punteggio finale (devono coprire 0-100 senza buchi)
  result_ranges:
    - min: 75
      max: 100
      color: "#22c55e"
      label: "Il tuo e-commerce ha basi solide"
      message: "Il tuo e-commerce ha una struttura matura. Il potenziale di crescita è nell'ottimizzazione fine: i dettagli che fanno la differenza tra un e-commerce che funziona e uno che scala."
      cta_text: "Vuoi scoprire le ottimizzazioni specifiche che possono portarti al livello successivo? In 30 minuti analizziamo insieme i dati del tuo e-commerce e ti consegniamo un report con le 3 azioni a più alto impatto."
      motivational_title: "Vuoi sapere dove si nasconde il prossimo salto di crescita?"
      motivational_text: "Prenota un incontro gratuito di 30 minuti: analizzeremo il tuo e-commerce nel dettaglio e ti consegneremo un report con le ottimizzazioni a più alto impatto per la tua situazione. Se vuoi, anticipaci su cosa vorresti concentrarti: ci aiuta a preparare un'analisi più mirata."
      open_field_placeholder: "Su cosa vorresti concentrarti?"

    - min: 50
      max: 74
      color: "#eab308"
      label: "Buone fondamenta, margini di crescita importanti"
      message: "Hai costruito una base che funziona, ma ci sono aree specifiche dove stai lasciando risultati sul tavolo. Sono interventi concreti, non rivoluzioni ed è proprio dove si nasconde il fatturato inespresso."
      cta_text: "Abbiamo identificato dove si nasconde il tuo fatturato inespresso. In una call di 30 minuti ti mostriamo esattamente dove intervenire e ti consegniamo un report personalizzato con le priorità."
      motivational_title: "Vuoi trasformare questi margini in fatturato?"
      motivational_text: "Prenota un incontro gratuito di 30 minuti: analizzeremo il tuo e-commerce e ti consegneremo un report personalizzato con le priorità di intervento partendo da quelle che producono risultati più velocemente. Se vuoi, raccontaci qual è la sfida che senti più urgente."
      open_field_placeholder: "Qual è la sfida che senti più urgente?"

    - min: 25
      max: 49
      color: "#f97316"
      label: "Ci sono leve che non stai usando"
      message: "Il tuo e-commerce ha potenziale, ma alcune aree critiche stanno lavorando contro di te. La buona notizia: sono problemi comuni e risolvibili e sapere dove sono è già metà del lavoro."
      cta_text: "Le aree di intervento sono chiare. In 30 minuti ti consegniamo un report con la sequenza esatta di azioni per sbloccare i risultati partendo da quelle che fanno la differenza più velocemente."
      motivational_title: "Vuoi sapere da dove iniziare?"
      motivational_text: "Prenota un incontro gratuito di 30 minuti: ti consegneremo un report con la sequenza di azioni concrete per il tuo e-commerce: niente teoria, solo quello che serve fare prima e quello che può aspettare. Se vuoi, raccontaci cosa ti frena di più in questo momento."
      open_field_placeholder: "Cosa ti frena di più in questo momento?"

    - min: 0
      max: 24
      color: "#ef4444"
      label: "Le basi da consolidare prima di scalare"
      message: "Prima di investire di più in advertising o nuovi canali, serve consolidare le fondamenta. Non è un problema di ambizione: è una questione di sequenza. Investire ora senza queste basi significa disperdere budget."
      cta_text: "La buona notizia: sapere dove sei è il primo passo. In 30 minuti ti aiutiamo a definire le priorità e ti consegniamo una roadmap concreta per costruire le basi su cui far crescere il tuo e-commerce."
      motivational_title: "Il primo passo è sapere dove sei. Il secondo è avere un piano."
      motivational_text: "Prenota un incontro gratuito di 30 minuti: ti consegneremo una roadmap chiara con le priorità per il tuo e-commerce costruita sulla tua situazione reale, non su best practice generiche. Se vuoi, raccontaci cosa senti come il problema più urgente."
      open_field_placeholder: "Cosa senti come il problema più urgente?"

  # Punteggio medio mostrato come benchmark nella pagina risultato
  benchmark_score: 52
  benchmark_text: "Il punteggio medio degli e-commerce che fanno questa analisi è 52/100."

  # Frasi di transizione mostrate dopo ogni risposta (random)
  transition_messages:
    - "Capito. Questa informazione ci aiuta a calibrare l'analisi."
    - "Bene, andiamo avanti."
    - "Ok, un quadro più chiaro."
    - "Registrato. Proseguiamo."
    - "Perfetto, ci siamo quasi."

  # Finding di fallback mostrato quando non ci sono né findings negativi né positivi
  fallback_finding:
    title: "Ottimizzazione fine"
    text: "Il tuo e-commerce ha basi solide su tutti i fronti. Il margine di crescita è nell'ottimizzazione fine: A/B testing sistematico, segmentazione avanzata, e una strategia di scaling che non sacrifichi i margini."

  # Campo di testo libero in fondo al quiz
  open_field:
    text: "Qual è la sfida più grande per il tuo e-commerce in questo momento?"
    placeholder: "Racconta liberamente quello che senti come il freno principale alla crescita del tuo e-commerce."
    max_length: 500

  # NOTA: `calendly_url` NON è in questo file — viene letto da
  # config('services.calendly.url') così resta configurabile via .env.

# =====================================================================
# AREA LABELS — usate per i fallback findings.
# Una entry per ogni domanda con scored=true. La chiave deve combaciare
# con la `key` della domanda corrispondente.
# =====================================================================
area_labels:
  advertising:  "la gestione advertising"
  coordination: "il coordinamento tra marketing e sito"
  tracking:     "il setup di tracciamento dati"
  mobile:       "l'esperienza mobile"
  retention:    "la fidelizzazione clienti"
